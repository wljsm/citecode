name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  eval:
    name: 评测（回放，无需密钥）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # cassette 随仓库提交，因此这条基准在 CI 里完全离线、可复现。
      - run: node dist/cli.js eval --replay fixtures/cassettes --fail-under 0.8
      # 第二个套件把 CiteCode 自己当作被测仓库（10 题，文件更大、引用更容易错位）
      - run: node dist/cli.js eval --golden eval/golden-self.json --replay fixtures/cassettes-self --fail-under 0.7
      # 故障注入回放：验证「校验 → 回灌 → 重查 → 重答」这条闭环在离线状态下同样会触发
      - run: node dist/cli.js eval --golden eval/golden-self.json --replay fixtures/faults-self --faults 1 --fail-under 0.6
      # 消融对照表也能离线复现，避免 README 里的数字只能靠一张嘴
      - run: node dist/cli.js ablation --replay fixtures/ablation
      # Web UI 端到端：真起 HTTP 服务，跑一题并解析 SSE
      - run: npx tsx scripts/web-smoke.ts
      # 快照导出（README 里那张图的来源）也必须能跑通
      - run: node dist/cli.js web --export /tmp/demo.html --case entry --replay fixtures/cassettes
